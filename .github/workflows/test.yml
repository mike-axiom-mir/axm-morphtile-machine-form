name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mike-axiom-mir/axm-morphtile
          ref: a579182ae585e5722ac87dd0cc8209963b18d000
          path: .runtime/morphtile
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          MORPHTILE_CORE_PATH: ${{ github.workspace }}/.runtime/morphtile/core/morphtile.js
          MORPHTILE_COMMIT: a579182ae585e5722ac87dd0cc8209963b18d000
